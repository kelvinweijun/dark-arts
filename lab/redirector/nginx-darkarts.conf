# nginx TLS-terminating redirector for the Dark Arts lab relay.
# Place at /etc/nginx/sites-available/darkarts-redirector and symlink to
# /etc/nginx/sites-enabled (setup.sh does this for you).
#
# The VPS terminates HTTPS (443) and forwards plain HTTP to the lab host's
# relay (7443). The relay does not see TLS at all, so no relay changes needed.

server {
    listen 443 ssl;
    server_name _;   # or your domain

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 64m;

    location / {
        proxy_pass http://<LAB_HOST_IP>:7443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
